name: Mirror to the plugin branch

on:
  push:
    branches: [master]

jobs:
  mirror-to-plugin:
    runs-on: burn
    name: Mirror to the plugin branch
    steps:
      - name: Install dependencies
        run: |
          apt update
          apt install -y rsync

      - name: Copy to plugin branch
        uses: https://github.com/tuftsrt/copy-to-branch@v1
        with:
          destination-branch: plugin
          clear-destination: true
          copy: plugin/|

      - uses: actions/checkout@v4
        with:
          ref: plugin
          fetch-depth: 0

      - name: Setup git user
        run: |
          git config user.name "SerhiiCho"
          git config user.email "SerhiiCho@users.noreply.codeberg.org"
          chown -R $USER:$USER .

      - name: Install and build assets
        run: |
          npm install
          npm run prod

      - name: Install PHP and Composer
        run: |
          apt update
          apt install -y php-cli php-xml php-mbstring php-curl php-zip unzip
          curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer

      - name: Install dependencies
        run: |
          composer install --no-dev --no-progress --no-interaction

      - name: Push to plugin branch
        run: |
          # Only commit and push if there are changes
          if [ -n "$(git status --porcelain)" ]; then
              git add vendor assets/js
              git commit -m "ci: update files"
              git push origin plugin
          else
              echo "No changes to commit"
          fi
